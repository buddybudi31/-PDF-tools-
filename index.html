<title>文書小幫手:PDF 與圖片批次處理</title>

<style>
:root{--bg:#F4F7FB;--sf:#fff;--ink:#1F2A37;--mute:#64748B;--line:#DCE3EC;--acc:#2563EB;--accbg:#EAF1FF;--accbd:#9DB7E8;--ai:#fff;--err:#C62828;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:32px 16px 56px}
h1{font-size:clamp(1.8rem,6vw,2.5rem);line-height:1.25;margin:0 0 8px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.lng{flex:none;background:var(--sf);border:1px solid var(--line);border-radius:999px;color:var(--ink);font:inherit;font-size:.9rem;padding:6px 16px;cursor:pointer}
.lng:hover{border-color:var(--accbd)}
.sub{color:var(--mute);margin:0 0 14px;font-size:1.05rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:0 0 26px}
.chips li{background:var(--sf);border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-size:.9rem}
nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
nav button{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--sf);border:2px solid var(--line);border-radius:14px;color:var(--ink);font:inherit;font-weight:500;padding:14px 6px;cursor:pointer}
nav button:hover{border-color:var(--accbd)}
nav button[aria-selected=true]{border-color:var(--acc);background:var(--accbg);color:var(--acc);font-weight:700}
.ti{font-size:1.7rem;line-height:1}
button:focus-visible,.drop:focus-within,select:focus-visible,input:focus-visible{outline:3px solid var(--accbd);outline-offset:2px}
section{background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:22px;margin-top:16px;box-shadow:0 1px 3px rgba(30,60,120,.06)}
.step{display:flex;align-items:center;gap:10px;font-size:1.05rem;margin:26px 0 12px}
.step:first-child{margin-top:0}
.step i{display:grid;place-items:center;flex:none;width:26px;height:26px;border-radius:50%;background:var(--acc);color:var(--ai);font-style:normal;font-size:.85rem;font-weight:700}
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;padding:34px 16px;background:var(--accbg);border:2px dashed var(--accbd);border-radius:14px;text-align:center;cursor:pointer}
.drop.on,.drop:hover{border-color:var(--acc);background:#DCE9FF}
.di{font-size:2.2rem;line-height:1.2}
.drop b{font-size:1.1rem}.drop span:not(.di){color:var(--mute);font-size:.92rem}
.list{list-style:none;margin:14px 0 0;padding:0}
.list li{display:flex;align-items:center;gap:8px;padding:10px 4px;border-bottom:1px solid var(--line)}
.list .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .s{color:var(--mute);font-size:.85rem}
.list button,.srow button{background:var(--sf);border:1px solid var(--line);border-radius:8px;color:var(--ink);width:36px;height:36px;cursor:pointer}
.opts{display:flex;flex-wrap:wrap;gap:12px 22px}
.opts label{display:flex;align-items:center;gap:8px;font-size:.95rem}
select,input[type=text],input[type=number]{font:inherit;color:var(--ink);background:#fff;border:1px solid #C3CEDC;border-radius:8px;padding:8px 10px}
.rows{width:100%}
.srow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;width:100%}
.bar{display:flex;align-items:center;flex-wrap:wrap;gap:12px}
.go{background:var(--acc);color:var(--ai);border:0;border-radius:10px;font:inherit;font-weight:700;font-size:1.05rem;min-height:48px;padding:12px 30px;cursor:pointer;box-shadow:0 2px 6px rgba(37,99,235,.3)}
.go:disabled{background:#B8C4D6;box-shadow:none;cursor:not-allowed}
.clr,.lnk{background:none;border:0;color:var(--mute);font:inherit;text-decoration:underline;cursor:pointer;padding:8px}
.st{color:var(--mute);font-size:.95rem}.st.e{color:var(--err);font-weight:500}
.note{margin-top:22px;color:var(--mute);font-size:.85rem}
@media (max-width:520px){main{padding-top:24px}section{padding:18px}.go{width:100%}}
</style>

<body>
<main>
<div class="hd"><h1>文書小幫手</h1><button type="button" class="lng" id="lang" data-nt>English</button></div>
<p class="sub">合併、拆分、壓縮 PDF,圖片轉檔。選一個功能就能開始。</p>
<ul class="chips"><li>🔒 檔案不會離開你的裝置</li><li>⚡ 免註冊、免安裝</li></ul>
<noscript><p>This tool needs JavaScript. 這個工具需要開啟 JavaScript 才能使用。</p></noscript>
<nav role="tablist" id="tabs"></nav>
<div id="panels"></div>
<p class="note">加密或有密碼保護的 PDF 無法處理。圖片轉檔會重新編碼,畫質與檔案大小會依設定改變。</p>
</main>
<script>
const $=(s,r=document)=>r.querySelector(s);
const fmt=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.ceil(n/1024)+' KB';
const toBlob=(c,t,q)=>new Promise(r=>c.toBlob(r,t,q));
const base=n=>n.replace(/\.[^.]+$/,'');
async function bmp(f){const b=await createImageBitmap(f,{imageOrientation:'from-image'});const c=document.createElement('canvas');c.width=b.width;c.height=b.height;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(b,0,0);return c}
function parse(s,n){const r=[];for(const p of s.split(/[,,\s]+/).filter(Boolean)){const m=p.match(/^(\d*)-(\d*)$/);if(m){const a=+m[1]||1,b=Math.min(+m[2]||n,n);for(let i=a;i<=b;i++)r.push(i-1)}else if(/^\d+$/.test(p)&&+p>0&&+p<=n)r.push(+p-1)}return r}
const T={
merge:{label:'合併 PDF',accept:'application/pdf,.pdf',hint:'選擇多個 PDF,用 ↑ ↓ 調整順序',btn:'合併並下載',
 async run(fs){const{PDFDocument:D}=PDFLib,o=await D.create();for(const f of fs){const d=await D.load(await f.arrayBuffer());(await o.copyPages(d,d.getPageIndices())).forEach(p=>o.addPage(p))}return[{name:tr('合併')+'.pdf',blob:new Blob([await o.save()],{type:'application/pdf'})}]}},
img2pdf:{label:'圖片轉 PDF',accept:'image/*',hint:'選擇多張圖片,每張變成一頁,順序可調整',btn:'轉成 PDF 並下載',
 opts:'<label>頁面大小<select data-o="size"><option value="a4">A4(自動置中縮放)</option><option value="fit">與圖片相同</option></select></label>',
 async run(fs,o){const{PDFDocument:D}=PDFLib,d=await D.create();for(const f of fs){const c=await bmp(f),im=await d.embedJpg(await(await toBlob(c,'image/jpeg',.92)).arrayBuffer());
  if(o.size==='fit'){d.addPage([im.width,im.height]).drawImage(im,{x:0,y:0,width:im.width,height:im.height})}
  else{const L=im.width>im.height,W=L?841.89:595.28,H=L?595.28:841.89,s=Math.min((W-40)/im.width,(H-40)/im.height,1),w=im.width*s,h=im.height*s;d.addPage([W,H]).drawImage(im,{x:(W-w)/2,y:(H-h)/2,width:w,height:h})}}
  return[{name:tr('圖片合集')+'.pdf',blob:new Blob([await d.save()],{type:'application/pdf'})}]}},
imgc:{label:'壓縮 / 轉換圖片',accept:'image/*',hint:'一次處理多張圖片,多張時會打包成 ZIP',btn:'處理並下載',
 opts:'<label>輸出格式<select data-o="fmt"><option value="jpeg">JPG</option><option value="webp">WebP</option><option value="png">PNG</option></select></label><label>品質<input data-o="q" type="number" min="10" max="100" value="75" style="width:70px"> %</label><label>最大寬度<input data-o="w" type="number" min="100" placeholder="不限" style="width:90px"> px</label>',
 async run(fs,o){const out=[];let a=0,b=0;for(const f of fs){let c=await bmp(f);const mw=+o.w;if(mw&&c.width>mw){const k=mw/c.width,n=document.createElement('canvas');n.width=mw;n.height=Math.round(c.height*k);n.getContext('2d').drawImage(c,0,0,n.width,n.height);c=n}
  const bl=await toBlob(c,'image/'+o.fmt,Math.min(100,Math.max(10,+o.q||75))/100);a+=f.size;b+=bl.size;out.push({name:base(f.name)+'.'+(o.fmt==='jpeg'?'jpg':o.fmt),blob:bl})}
  out.info='原始 '+fmt(a)+' → 處理後 '+fmt(b);return out}},
compress:{label:'壓縮 PDF',accept:'application/pdf,.pdf',hint:'把掃描檔或圖片多的 PDF 變小。每頁會轉成圖片,文字將無法選取或搜尋',btn:'壓縮並下載',
 opts:'<label>清晰度<select data-o="s"><option value="1">標準(檔案最小)</option><option value="1.5" selected>較清晰</option><option value="2">高清</option></select></label><label>JPEG 品質<input data-o="q" type="number" min="10" max="100" value="70" style="width:70px"> %</label>',
 async run(fs,o,say){const J=window.pdfjsLib,{PDFDocument:D}=PDFLib;J.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const out=[];let a=0,b=0;const q=Math.min(100,Math.max(10,+o.q||70))/100;
  for(const f of fs){const src=await J.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise,d=await D.create();
   for(let i=1;i<=src.numPages;i++){say(f.name+':第 '+i+' / '+src.numPages+' 頁');const pg=await src.getPage(i),v1=pg.getViewport({scale:1}),v=pg.getViewport({scale:+o.s}),c=document.createElement('canvas');c.width=Math.ceil(v.width);c.height=Math.ceil(v.height);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);await pg.render({canvasContext:x,viewport:v}).promise;
    const im=await d.embedJpg(await(await toBlob(c,'image/jpeg',q)).arrayBuffer());d.addPage([v1.width,v1.height]).drawImage(im,{x:0,y:0,width:v1.width,height:v1.height});c.width=c.height=0}
   const bl=new Blob([await d.save()],{type:'application/pdf'});a+=f.size;b+=bl.size;out.push({name:base(f.name)+tr('_壓縮')+'.pdf',blob:bl})}
  out.info='原始 '+fmt(a)+' → 處理後 '+fmt(b)+(b>=a?'(沒有變小,這份檔案可能已經很精簡)':'');return out}},
split:{label:'拆分 PDF',accept:'application/pdf,.pdf',single:true,hint:'選擇一個 PDF,先輸入要拆成幾份,再填每一份的頁碼與檔名',btn:'拆分並下載',
 opts:'<label>要拆成幾份<input type="number" id="splitN" min="1" max="50" placeholder="例如 3" style="width:90px"></label><label>檔名前綴<input type="text" id="splitP" placeholder="例如 合約_" style="width:150px"></label><button type="button" class="lnk" id="splitA">自動編號(01、02⋯⋯)</button><div class="rows"></div>',
 async run(fs,o){const{PDFDocument:D}=PDFLib,s=await D.load(await fs[0].arrayBuffer()),n=s.getPageCount(),b0=base(fs[0].name);
  const rows=[...document.querySelectorAll('.srow')].map(r=>({r:$('.rg',r).value.trim(),m:$('.nm',r).value.trim().replace(/[\/:*?"<>|]/g,'')}));
  if(!rows.length)throw new Error('請先輸入要拆成幾份');const out=[],u=new Set();
  for(const[i,x]of rows.entries()){const ix=x.r?parse(x.r,n):s.getPageIndices();if(!ix.length)throw new Error('第 '+(i+1)+' 份的頁碼無效,這份 PDF 共 '+n+' 頁');
   const d=await D.create();(await d.copyPages(s,ix)).forEach(p=>d.addPage(p));
   let nm=x.m?x.m.replace(/\.pdf$/i,''):b0+'_'+pt(i+1);while(u.has(nm))nm+='_'+(i+1);u.add(nm);
   out.push({name:nm+'.pdf',blob:new Blob([await d.save()],{type:'application/pdf'})})}
  return out}}
};
async function finish(outs,cn){cn=(cn||'').trim().replace(/[\/:*?"<>|]/g,'');let name,blob;
 if(outs.length===1){name=outs[0].name;blob=outs[0].blob;if(cn){const e=name.slice(name.lastIndexOf('.'));name=(cn.toLowerCase().endsWith(e.toLowerCase())?cn.slice(0,-e.length):cn)+e}}
 else{const z=new JSZip(),u=new Set();outs.forEach((x,i)=>{let n=x.name;if(u.has(n))n=(i+1)+'_'+n;u.add(n);z.file(n,x.blob)});blob=await z.generateAsync({type:'blob'});name=((cn.toLowerCase().endsWith('.zip')?cn.slice(0,-4):cn)||tr('輸出檔案'))+'.zip'}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),10000)}
const IC={merge:'📑',img2pdf:'🖼️',imgc:'🪄',compress:'📦',split:'✂️'};
const tabs=$('#tabs'),panels=$('#panels');
Object.entries(T).forEach(([k,t],i)=>{
 const tb=document.createElement('button');tb.innerHTML='<span class="ti">'+IC[k]+'</span><span>'+t.label+'</span>';tb.role='tab';tb.setAttribute('aria-selected',i===0);tabs.append(tb);
 const p=document.createElement('section');p.hidden=i!==0;p.setAttribute('role','tabpanel');
 p.innerHTML=`<h2 class="step"><i>1</i>選擇檔案</h2><label class="drop"><span class="di">📂</span><b>拖放檔案到這裡,或點擊選擇</b><span>${t.hint}</span><input type="file" accept="${t.accept}" ${t.single?'':'multiple'} hidden></label><ul class="list"></ul><h2 class="step"><i>2</i>調整設定(選填)</h2><div class="opts">${t.opts||''}<label>輸出檔名<input data-o="name" type="text" placeholder="留空使用預設名稱" style="width:200px"></label></div><h2 class="step"><i>3</i>開始處理</h2><div class="bar"><button class="go" disabled>${t.btn}</button><button class="clr" type="button">清空</button><span class="st" role="status"></span></div>`;
 panels.append(p);
 if(k==='split'){const R=$('.rows',p),N=$('#splitN',p),nm=$('[data-o="name"]',p);nm.previousSibling.textContent='ZIP 檔名';nm.placeholder='ZIP 名稱(選填)';
  const P=$('#splitP',p),pad=i=>String(i).padStart(2,'0'),pn=i=>P.value.trim()?P.value.trim()+pad(i):'';
  $('#splitA',p).onclick=()=>{if(!P.value.trim())return;[...R.children].forEach((r,j)=>{$('.nm',r).value=pn(j+1)})};
  const mk=i=>{const r=document.createElement('div');r.className='srow';r.innerHTML='<b style="width:3.6em;line-height:34px">第 '+i+' 份</b><input type="text" class="rg" placeholder="頁碼,例如 1-3, 5" style="width:170px"><input type="text" class="nm" placeholder="檔名(留空用預設)" style="flex:1;min-width:140px">';$('.nm',r).value=pn(i);R.append(r)};
  N.oninput=()=>{const n=Math.min(50,Math.max(0,parseInt(N.value)||0));while(R.children.length<n)mk(R.children.length+1);while(R.children.length>n)R.lastChild.remove()}}
 let files=[];const ul=$('.list',p),go=$('.go',p),st=$('.st',p),drop=$('.drop',p),inp=$('input',p);
 const say=(m,e)=>{st.textContent=m;st.classList.toggle('e',!!e)};
 const draw=()=>{ul.innerHTML='';files.forEach((f,j)=>{const li=document.createElement('li');li.innerHTML='<span class="n" data-nt></span><span class="s">'+fmt(f.size)+'</span><button type="button" aria-label="上移">↑</button><button type="button" aria-label="下移">↓</button><button type="button" aria-label="移除">×</button>';
  $('.n',li).textContent=f.name;const[b1,b2,b3]=li.querySelectorAll('button');
  b1.onclick=()=>{if(j>0){[files[j-1],files[j]]=[files[j],files[j-1]];draw()}};b2.onclick=()=>{if(j<files.length-1){[files[j+1],files[j]]=[files[j],files[j+1]];draw()}};b3.onclick=()=>{files.splice(j,1);draw()};ul.append(li)});
  go.disabled=!files.length;say('')};
 const add=l=>{const a=[...l];files=t.single?a.slice(0,1):files.concat(a);draw()};
 inp.onchange=()=>{add(inp.files);inp.value=''};
 drop.ondragover=e=>{e.preventDefault();drop.classList.add('on')};drop.ondragleave=()=>drop.classList.remove('on');
 drop.ondrop=e=>{e.preventDefault();drop.classList.remove('on');add(e.dataTransfer.files)};
 $('.clr',p).onclick=()=>{files=[];draw()};
 go.onclick=async()=>{const o={};p.querySelectorAll('[data-o]').forEach(x=>o[x.dataset.o]=x.value);go.disabled=true;say('處理中⋯⋯');
  try{const outs=await t.run(files,o,say);await finish(outs,o.name);say('✅ 完成'+(outs.info?':'+outs.info:''))}
  catch(e){say(e.code==='declined'?'已取消下載':(e.message||'處理失敗,請確認檔案格式是否正確'),true)}
  go.disabled=!files.length};
 tb.onclick=()=>{tabs.querySelectorAll('button').forEach(x=>x.setAttribute('aria-selected',x===tb));panels.querySelectorAll('section').forEach(x=>x.hidden=x!==p)};
});

const nk=s=>s.replace(/，/g,',').replace(/（/g,'(').replace(/）/g,')').replace(/：/g,':');
const EN={

'合併 PDF':'Merge PDF','選擇多個 PDF,用 ↑ ↓ 調整順序':'Choose several PDFs and use ↑ ↓ to set the order','合併並下載':'Merge and download',
'圖片轉 PDF':'Images to PDF','選擇多張圖片,每張變成一頁,順序可調整':'Choose several images. Each becomes one page, and you can reorder them','轉成 PDF 並下載':'Convert and download',
'頁面大小':'Page size','A4(自動置中縮放)':'A4 (centered and scaled to fit)','與圖片相同':'Same as image',
'壓縮 / 轉換圖片':'Compress / convert images','一次處理多張圖片,多張時會打包成 ZIP':'Process many images at once. Multiple results are bundled into a ZIP','處理並下載':'Process and download',
'輸出格式':'Output format','品質':'Quality','最大寬度':'Max width','不限':'No limit',
'壓縮 PDF':'Compress PDF','把掃描檔或圖片多的 PDF 變小。每頁會轉成圖片,文字將無法選取或搜尋':'Shrink scanned or image-heavy PDFs. Each page becomes an image, so text can’t be selected or searched','壓縮並下載':'Compress and download',
'清晰度':'Sharpness','標準(檔案最小)':'Standard (smallest file)','較清晰':'Clearer','高清':'High quality','JPEG 品質':'JPEG quality',
'拆分 PDF':'Split PDF','選擇一個 PDF,先輸入要拆成幾份,再填每一份的頁碼與檔名':'Choose one PDF, enter how many parts to split it into, then fill in each part’s pages and name','拆分並下載':'Split and download',
'要拆成幾份':'Split into how many parts','例如 3':'e.g. 3','檔名前綴':'Name prefix','例如 合約_':'e.g. Contract_','自動編號(01、02⋯⋯)':'Auto-number (01, 02…)',

const RU=[[/\s*:\s*第 (\d+) \/ (\d+) 頁/,': page $1 / $2'],[/第 (\d+) 份的頁碼無效,這份 PDF 共 (\d+) 頁/,'Part $1 has invalid page numbers. This PDF has $2 pages.'],[/^第 (\d+) 份$/,'Part $1'],[/✅ 完成:/,'✅ Done: '],[/✅ 完成/,'✅ Done'],[/原始 /,'Original '],[/→ 處理後 /,'→ Result '],[/\(沒有變小,這份檔案可能已經很精簡\)/,' (not smaller; this file may already be compact)']];
const CJK=/[\u3000-\u9fff\uff00-\uffef]/;
let lang='';
try{lang=localStorage.getItem('lang')||''}catch(e){}
if(lang!=='zh'&&lang!=='en')lang=/^zh/i.test(navigator.language||'')?'zh':'en';
const xl=s=>{if(!CJK.test(s))return s;const k=nk(s.trim());if(k in EN)return s.replace(s.trim(),EN[k]);let r=nk(s);for(const[a,b]of RU)r=r.replace(a,b);return r};
const tr=s=>lang==='en'?xl(s):s;
const pt=i=>lang==='en'?'part'+i:'第'+i+'份';
function tx(root){const L=[];
 if(root.nodeType===3)L.push(root);
 else if(root.nodeType===1){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode())L.push(n);
  for(const e of[root,...root.querySelectorAll('[placeholder],[aria-label]')])for(const a of['placeholder','aria-label']){if(!e.hasAttribute(a))continue;const o=e._z||(e._z={});if(!(a in o)){const v=e.getAttribute(a);if(!CJK.test(v))continue;o[a]=v}e.setAttribute(a,lang==='en'?xl(o[a]):o[a])}}
 for(const t of L){const p=t.parentElement;if(p&&(p.closest('[data-nt]')||/^(SCRIPT|STYLE|NOSCRIPT)$/.test(p.tagName)))continue;if(t.__z===undefined){if(!CJK.test(t.nodeValue))continue;t.__z=t.nodeValue}t.nodeValue=lang==='en'?xl(t.__z):t.__z}}
new MutationObserver(m=>m.forEach(r=>r.addedNodes.forEach(tx))).observe(document.body,{childList:true,subtree:true});
const lb=$('#lang');
function setLang(l,save){lang=l;if(save)try{localStorage.setItem('lang',l)}catch(e){}document.documentElement.lang=l==='en'?'en':'zh-Hant';document.title=l==='en'?'DocDesk: Batch PDF & Image Tools':'文書小幫手:PDF 與圖片批次處理';lb.textContent=l==='en'?'中文':'English';tx(document.body)}
lb.onclick=()=>setLang(lang==='en'?'zh':'en',true);
setLang(lang,false);
</script>
